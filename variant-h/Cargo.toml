[package]
name = "eve-dogma-h"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bincode = "1.3"
flate2 = "1.1.10"
hecs = "0.10"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
