[package]
name = "eve-dogma-h-wasm"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "WebAssembly build of Variant H (browser / Node): C-ABI exports, no JS glue dependencies"

[lib]
crate-type = ["cdylib"]

[dependencies]
eve-dogma-h = { path = ".." }
serde_json = "1.0.151"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

# standalone: not part of a parent workspace
[workspace]
