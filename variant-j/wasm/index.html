<!doctype html>
<!-- Minimal browser front-end for the WASM build. Serve variant-j/ over HTTP (e.g. `python3 -m http.server` in
     variant-j/) after `emcmake cmake -S . -B build-wasm -G Ninja && ninja -C build-wasm`, open /wasm/index.html,
     pick the dataset .json.gz, then compute a FitRequest. -->
<html lang="en">
<head><meta charset="utf-8"><title>eve-dogma-j (WASM)</title>
<style>body{font:14px system-ui;margin:1em}textarea{width:100%;height:14em;font:12px monospace}pre{background:#f4f4f4;padding:.5em;max-height:30em;overflow:auto}</style></head>
<body>
<h1>eve-dogma-j — WebAssembly</h1>
<p>Dataset (.json.gz): <input type="file" id="ds" accept=".gz,.json"> <span id="st">loading module…</span></p>
<textarea id="req">{"ship":{"type_id":587},"modules":[{"type_id":2048,"slot":"low","state":"online"}]}</textarea>
<p><button id="calc" disabled>calc</button> <button id="rpc" disabled>serve-stdio line</button></p>
<pre id="out"></pre>
<script type="module">
import createEvej from "../build-wasm/evej.mjs";
const M = await createEvej();
const open = M.cwrap("evej_open", "string", ["string"]);
const calc = M.cwrap("evej_calc", "string", ["string"]);
const rpc = M.cwrap("evej_rpc", "string", ["string"]);
const $ = (id) => document.getElementById(id);
$("st").textContent = "module ready; choose the dataset";
$("ds").onchange = async (e) => {
  const buf = new Uint8Array(await e.target.files[0].arrayBuffer());
  M.FS.writeFile("/dataset.json.gz", buf);
  const t = performance.now(), err = open("/dataset.json.gz");
  $("st").textContent = err ? "error: " + err : `dataset loaded in ${(performance.now() - t).toFixed(0)} ms`;
  $("calc").disabled = $("rpc").disabled = !!err;
};
const show = (s) => { try { $("out").textContent = JSON.stringify(JSON.parse(s), null, 2); } catch { $("out").textContent = s; } };
$("calc").onclick = () => { const t = performance.now(); const r = calc($("req").value); show(r); $("st").textContent = `calc ${(performance.now() - t).toFixed(2)} ms`; };
$("rpc").onclick = () => show(rpc($("req").value));
</script>
</body>
</html>
