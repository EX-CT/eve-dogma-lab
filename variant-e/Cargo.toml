[package]
name = "eve-dogma-e"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Variant E: Pyfa-faithful Rust port of the eos fitting engine (EX-CT eve-dogma-lab)"

[[bin]]
name = "eve-dogma-e"
path = "src/main.rs"

[lib]
name = "eve_dogma_e"
path = "src/lib.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
bincode = "1.3"
flate2 = "1"
rustc-hash = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
