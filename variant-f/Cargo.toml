[package]
name = "eve-dogma-f"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "EVE dogma engine variant F: SDE compiled into Rust at build time (native CLI + wasm32)"
build = "build.rs"

[lib]
name = "eve_dogma_f"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "eve-dogma-f"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
itoa = "1"
zmij = "1"

[build-dependencies]
flate2 = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"
strip = true
