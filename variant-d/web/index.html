<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eve-dogma-ts — browser demo (variant D)</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem; max-width: 1100px; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 12px ui-monospace, monospace; }
  textarea { height: 14rem; }
  pre { background: #f5f5f5; padding: .75rem; max-height: 30rem; overflow: auto; }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  table { border-collapse: collapse; } td { padding: 2px 10px 2px 0; }
</style>
</head>
<body>
<h1>eve-dogma-ts in the browser</h1>
<p>Same engine as the Node CLI (zero dependencies), running entirely client-side. Paste a FitRequest JSON
(see the eve-dogma contract) or an EFT block.</p>
<div class="row">
  <label>Dataset URL <input id="ds" size="60"></label>
  <button id="load">Load dataset</button> <span id="status">not loaded</span>
</div>
<textarea id="req">{"ship":{"type_id":587},"character":{"skills":{"default_level":5}},
 "modules":[{"type_id":2873,"charge_type_id":12625,"state":"active"},{"type_id":2873,"charge_type_id":12625,"state":"active"},
  {"type_id":2873,"charge_type_id":12625,"state":"active"},{"type_id":5973,"state":"active"},{"type_id":3242,"state":"active"},
  {"type_id":1999,"state":"online"},{"type_id":10190,"state":"online"},{"type_id":2605,"state":"online"}]}</textarea>
<div class="row"><button id="calc" disabled>Calculate</button> <span id="timing"></span></div>
<table id="summary"></table>
<pre id="out"></pre>
<script type="module">
import { Dataset, calc, parseEft, loadDatasetUrl, ENGINE } from '../dist-web/eve-dogma-ts.mjs';
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
$('ds').value = qs.get('dataset') ?? '../../../data/dataset-3569502.json.gz';
let ds = null;
async function load() {
  $('status').textContent = 'loading…';
  const t0 = performance.now();
  ds = await loadDatasetUrl($('ds').value);
  $('status').textContent = `${ENGINE}: SDE ${ds.build}, ${ds.types.size} types, ${(performance.now() - t0).toFixed(0)} ms`;
  $('calc').disabled = false;
}
function run() {
  const text = $('req').value.trim();
  const req = text.startsWith('{') ? JSON.parse(text) : parseEft(ds, text);
  const t0 = performance.now();
  const r = calc(ds, req);
  const ms = performance.now() - t0;
  $('timing').textContent = `${ms.toFixed(2)} ms`;
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  $('summary').innerHTML = r.error ? row('error', r.error.message) : [
    row('ship', r.ship.name), row('DPS', r.offense.total.dps.total.toFixed(1)), row('EHP', r.defense.ehp.total.toFixed(0)),
    row('cap stable', r.capacitor.stable), row('max velocity', r.navigation.max_velocity.toFixed(1)),
    row('CPU', `${r.resources.cpu.used} / ${r.resources.cpu.total}`), row('PG', `${r.resources.power.used} / ${r.resources.power.total}`),
  ].join('');
  $('out').textContent = JSON.stringify(r, null, 2);
  return r;
}
$('load').onclick = () => load().catch((e) => ($('status').textContent = 'error: ' + e.message));
$('calc').onclick = () => { try { run(); } catch (e) { $('out').textContent = String(e); } };
if (qs.has('selftest')) {
  // headless check: load, calc the default fit, write a one-line JSON verdict into #out
  load().then(() => {
    const r = run();
    $('out').textContent = 'SELFTEST ' + JSON.stringify({ engine: r.meta.engine, sha: r.meta.dataset_sha256,
      dps: r.offense.total.dps.total, ehp: r.defense.ehp.total, ms: Number($('timing').textContent.split(' ')[0]) });
  }).catch((e) => ($('out').textContent = 'SELFTEST ERROR ' + e.message));
} else load().catch(() => {});
</script>
</body>
</html>
