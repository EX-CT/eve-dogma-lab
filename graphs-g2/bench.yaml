# graphs round 2 (approach G2); run from this directory
build: npm ci && npx tsc -p . && (cd ../variant-c && go build -trimpath -o bin/eve-dogma-go ./cmd/eve-dogma-go)
graph_batch_cmd: ./bin/graph-batch --dataset {dataset}
graph_cmd: ./bin/graph --dataset {dataset}   # one GraphRequest (stdin or FILE) -> one GraphResult; exit 2 with {"error":…}
rpc_cmd: ./bin/serve-stdio --dataset {dataset}   # engine RPC + method "graph"; other methods proxied to eve-dogma-go serve-stdio
